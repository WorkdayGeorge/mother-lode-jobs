# Starting list of job sources, carried over from calaveras_job_agent.
#
# Loaded with:  python -m app.cli seed-sources
# Seeding only ADDS sources whose key isn't in the database yet, so it never
# overwrites changes made in Admin → Sources. After the first load, manage
# sources in Admin instead of editing this file.
#
# kind: government | employer | aggregator | remote

