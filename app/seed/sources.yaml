# ---- State and federal ------------------------------------------------------
- key: calcareers
  name: State of California (CalCareers)
  kind: government
  adapter: custom
  config: {scraper: calcareers}
  careers_url: https://calcareers.ca.gov/

- key: usajobs
  name: Federal jobs (USAJOBS)
  kind: government
  adapter: custom
  active: false   # turn on in Admin once USAJOBS_API_KEY / USAJOBS_USER_AGENT are set
  # organization blank = every agency; AG11 = U.S. Forest Service only
  config: {scraper: usajobs, organization: "", location: "San Andreas, California", radius_miles: 50}
  careers_url: https://www.usajobs.gov/

