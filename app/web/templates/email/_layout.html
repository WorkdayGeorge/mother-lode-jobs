<!doctype html>
<html><body style="margin:0;background:#e8efe7;font-family:Arial,Helvetica,sans-serif;color:#1c2420">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:8px">

<tr><td style="padding:24px;font-size:16px;line-height:1.5">{% block body %}{% endblock %}</td></tr>
