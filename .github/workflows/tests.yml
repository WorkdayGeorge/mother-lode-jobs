name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobs_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -c requirements.lock pytest ruff
      - run: ruff check app tests --select F,E9 --exclude app/sources/legacy
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jobs_test
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/jobs_test
        run: |
          python -c "from app.db import get_engine; from app.models import Base; Base.metadata.drop_all(get_engine())"
          python -m app.cli migrate
          alembic check
